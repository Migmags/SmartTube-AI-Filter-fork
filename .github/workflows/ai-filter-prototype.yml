name: AI Filter prototype build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-filter-prototype

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run AI filter unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testStslopDebugUnitTest

      - name: Build separate prototype APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStslopDebug

      - name: Upload prototype APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-ai-filter-prototype-unsigned-for-testing
          path: smarttubetv/build/outputs/apk/stslop/debug/*.apk
          if-no-files-found: error
